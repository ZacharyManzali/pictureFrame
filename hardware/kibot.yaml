# KiBot: generates every fabrication, assembly and documentation output from
# the KiCad project. Run locally with `make hw`; CI runs the same file.
kibot:
  version: 1

preflight:
  erc: true
  drc: true
  check_zone_fills: true

global:
  # File names: board-<output>-<revision>.<ext>; REVISION comes from board.kicad_pro
  output: '%f-%i%I-${REVISION}.%x'

outputs:
  # ---------------------------------------------------------------- fabrication
  - name: gerbers
    comment: Gerber files for PCB fabrication
    type: gerber
    dir: fab/gerbers
    layers: [copper, F.SilkS, B.SilkS, F.Mask, B.Mask, F.Paste, B.Paste, Edge.Cuts]
    options:
      create_gerber_job_file: true
      subtract_mask_from_silk: true

  - name: drill
    comment: Excellon drill files and drill map
    type: excellon
    dir: fab/gerbers
    options:
      map: pdf

  - name: fab_zip
    comment: Zip of gerbers + drill files, ready to upload to a fab house
    type: compress
    dir: fab
    options:
      files:
        - from_output: gerbers
          dest: /
        - from_output: drill
          dest: /

  # ------------------------------------------------------------------ assembly
  - name: bom_csv
    comment: Bill of materials (CSV) for purchasing and assembly
    type: bom
    dir: assembly
    options:
      format: CSV
      columns:
        - References
        - Quantity Per PCB
        - Value
        - Footprint
        - field: MPN
          name: Manufacturer Part Number
        - field: Manufacturer
        - field: LCSC
        - field: Description

  - name: position
    comment: Pick-and-place file for automated assembly
    type: position
    dir: assembly
    options:
      format: CSV
      only_smd: false

  - name: ibom
    comment: Interactive HTML BOM for hand assembly and bring-up
    type: ibom
    dir: assembly

  # ------------------------------------------------------------- documentation
  - name: schematic_pdf
    comment: Schematic PDF for review and client delivery
    type: pdf_sch_print
    dir: docs

  - name: pcb_pdf
    comment: Layer-by-layer PCB PDF
    type: pcb_print
    dir: docs
    options:
      output: '%f-pcb-${REVISION}.%x'
      format: PDF
      pages:
        - layers: [F.Cu, F.SilkS, Edge.Cuts]
          sheet: Top
        - layers: [B.Cu, B.SilkS, Edge.Cuts]
          mirror: true
          sheet: Bottom

  - name: step
    comment: 3D STEP model for mechanical/enclosure design
    type: step
    dir: mech
