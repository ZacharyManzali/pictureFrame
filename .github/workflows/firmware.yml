name: Firmware

on:
  push:
    paths: ["firmware/**", "west.yml", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "west.yml", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Add the project's real board here once it has a Zephyr board definition.
        board: [nucleo_f401re]
    steps:
      - uses: actions/checkout@v7
        with:
          path: project

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Creates a west workspace from west.yml and installs the Zephyr SDK.
      - uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: project
          toolchains: arm-zephyr-eabi

      - name: Build
        working-directory: project
        run: west build --pristine -b ${{ matrix.board }} -d build/${{ matrix.board }} firmware/app

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: |
            project/build/${{ matrix.board }}/zephyr/zephyr.elf
            project/build/${{ matrix.board }}/zephyr/zephyr.hex
            project/build/${{ matrix.board }}/zephyr/zephyr.bin
